      <rect x="1.5" y="10" width="7" height="10" rx="3" fill="#F7F0FB"/>
    </pattern>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.5"/>
      <stop offset="0.2" stop-color="#B57EDC" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#FFF" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#8E5AB5" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#FFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B57EDC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E4590" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6E4590" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#weave)"/>
