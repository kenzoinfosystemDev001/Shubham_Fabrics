<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FBE9E5"/>
      <rect x="0" y="0.6" width="4" height="2.8" rx="1.2" fill="#F6D5CE"/>
      <rect x="4" y="4.6" width="4" height="2.8" rx="1.2" fill="#F6D5CE"/>
      <rect x="4.6" y="0" width="2.8" height="4" rx="1.2" fill="#FDF4F2"/>
      <rect x="0.6" y="4" width="2.8" height="4" rx="1.2" fill="#FDF4F2"/>
    </pattern>
    <pattern id="weaveBig" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FBE9E5"/>
      <rect x="0" y="1.5" width="10" height="7" rx="3" fill="#F6D5CE"/>
      <rect x="10" y="11.5" width="10" height="7" rx="3" fill="#F6D5CE"/>
      <rect x="11.5" y="0" width="7" height="10" rx="3" fill="#FDF4F2"/>
      <rect x="1.5" y="10" width="7" height="10" rx="3" fill="#FDF4F2"/>
    </pattern>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.5"/>
      <stop offset="0.2" stop-color="#B57EDC" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#FFF" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#8E5AB5" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#FFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B57EDC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E4590" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6E4590" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#weave)"/>
  <rect width="640" height="360" fill="url(#fold)"/>
    <g filter="url(#soft)">
      <path d="M70 140 L560 120 L590 320 L90 330 Z" fill="#FDF4F2" fill-opacity="0.75" stroke="#E7B8AD" stroke-width="2"/>
      <path d="M80 130 L570 110" stroke="#F1CFC6" stroke-width="2"/>
    </g>
    <path d="M140 170 h120 l20 120 h-150 Z" fill="none" stroke="#8E5AB5" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M330 170 q 40 -30 80 0 l 16 110 h-112 Z" fill="none" stroke="#8E5AB5" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M110 300 L420 292" stroke="#FF6347" stroke-width="3" stroke-dasharray="12 8"/>
    
  <g transform="translate(520 286) rotate(178) scale(0.9)" filter="url(#soft)">
    <path d="M0 -6 L120 -22 L118 -14 Z" fill="#E9E4EF" stroke="#6E4590" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0 6 L120 22 L118 14 Z" fill="#F4F1F7" stroke="#6E4590" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5" fill="#6E4590"/>
    <ellipse cx="-38" cy="-22" rx="24" ry="16" fill="none" stroke="#8E5AB5" stroke-width="9"/>
    <ellipse cx="-38" cy="22" rx="24" ry="16" fill="none" stroke="#8E5AB5" stroke-width="9"/>
    <path d="M-16 -14 L0 -4 M-16 14 L0 4" stroke="#8E5AB5" stroke-width="9" stroke-linecap="round"/>
  </g>
  <rect width="640" height="360" fill="url(#shade)"/>
  <rect x="0" y="342" width="640" height="2" fill="#DFFF00" fill-opacity="0.55"/>
  <rect x="0" y="347" width="640" height="1" fill="#FF6347" fill-opacity="0.35"/>
</svg>
