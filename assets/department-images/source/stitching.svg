<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#EFE4F7"/>
      <rect x="0" y="0.6" width="4" height="2.8" rx="1.2" fill="#E2CFF0"/>
      <rect x="4" y="4.6" width="4" height="2.8" rx="1.2" fill="#E2CFF0"/>
      <rect x="4.6" y="0" width="2.8" height="4" rx="1.2" fill="#F7F0FB"/>
      <rect x="0.6" y="4" width="2.8" height="4" rx="1.2" fill="#F7F0FB"/>
    </pattern>
    <pattern id="weaveBig" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#EFE4F7"/>
      <rect x="0" y="1.5" width="10" height="7" rx="3" fill="#E2CFF0"/>
      <rect x="10" y="11.5" width="10" height="7" rx="3" fill="#E2CFF0"/>
      <rect x="11.5" y="0" width="7" height="10" rx="3" fill="#F7F0FB"/>
      <rect x="1.5" y="10" width="7" height="10" rx="3" fill="#F7F0FB"/>
    </pattern>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.5"/>
      <stop offset="0.2" stop-color="#B57EDC" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#FFF" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#8E5AB5" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#FFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B57EDC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E4590" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6E4590" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#weave)"/>
  <rect width="640" height="360" fill="url(#fold)"/>
    <path d="M0 150 L640 230 V360 H0 Z" fill="#E7D6F3" filter="url(#soft)"/>
    <path d="M0 178 L640 258" stroke="#6E4590" stroke-width="3" stroke-dasharray="14 8"/>
    <path d="M0 196 L640 276" stroke="#8E5AB5" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
    <path d="M0 160 L640 240" stroke="#FFF" stroke-opacity="0.6" stroke-width="2"/>
    <g filter="url(#soft)" transform="rotate(-32 450 150)">
      <rect x="360" y="146" width="190" height="8" rx="4" fill="#E6E3EA" stroke="#8E86A0" stroke-width="1.5"/>
      <path d="M550 146 L590 150 L550 154 Z" fill="#E6E3EA" stroke="#8E86A0" stroke-width="1.5"/>
      <ellipse cx="380" cy="150" rx="12" ry="2.2" fill="#FFF"/>
    </g>
    <path d="M378 196 C 320 140, 240 120, 170 180 S 90 260, 40 200" stroke="#FF6347" stroke-width="2.5" fill="none"/>
  <rect width="640" height="360" fill="url(#shade)"/>
  <rect x="0" y="342" width="640" height="2" fill="#DFFF00" fill-opacity="0.55"/>
  <rect x="0" y="347" width="640" height="1" fill="#FF6347" fill-opacity="0.35"/>
</svg>
