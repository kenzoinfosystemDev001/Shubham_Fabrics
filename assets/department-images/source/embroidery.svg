<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F5F9DD"/>
      <rect x="0" y="0.6" width="4" height="2.8" rx="1.2" fill="#EAF2BE"/>
      <rect x="4" y="4.6" width="4" height="2.8" rx="1.2" fill="#EAF2BE"/>
      <rect x="4.6" y="0" width="2.8" height="4" rx="1.2" fill="#FBFDEE"/>
      <rect x="0.6" y="4" width="2.8" height="4" rx="1.2" fill="#FBFDEE"/>
    </pattern>
    <pattern id="weaveBig" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F5F9DD"/>
      <rect x="0" y="1.5" width="10" height="7" rx="3" fill="#EAF2BE"/>
      <rect x="10" y="11.5" width="10" height="7" rx="3" fill="#EAF2BE"/>
