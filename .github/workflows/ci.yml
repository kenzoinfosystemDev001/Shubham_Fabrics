name: MES CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Compile Packages
        run: |
          npm run build --workspace=@subham/types
          npm run build --workspace=@subham/validation
          npm run build --workspace=@subham/config
          npm run build --workspace=@subham/database

      - name: Run Backend Tests
        run: npm run test --workspace=@subham/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_AwabUI89igpN@ep-red-bread-b4ddqxah-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'SubhamFabricsEnterpriseMESSecretKey2026SuperSecure_NoLeaks' }}
          NODE_ENV: test

      - name: Build Next.js Web App
        run: npm run build --workspace=@subham/web

      - name: Build NestJS API Gateway
        run: npm run build --workspace=@subham/api

